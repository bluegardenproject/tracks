# Generated by tracks on every start. Do not edit.
# Personal overrides: /home/u/.config/tracks-v2/tmux.conf
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:extkeys"
set -g escape-time 0
set -g extended-keys on
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g renumber-windows on
set-environment -g COLORTERM truecolor
set-environment -g TRACKS_NEW_APP 1
set-environment -gu TRACKS_ID
set-environment -gu TRACKS_SOCKET_DIR

set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=cyan]#[bold],#[fg=white]}#{@tracks_title}#[default] "
set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=cyan"
bind-key t run-shell -b "'/opt/tracks' --new-app trackwin add-terminal '#{window_id}'"
source-file -q "/home/u/.config/tracks-v2/tmux.conf"
