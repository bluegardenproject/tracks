# Generated by tracks on every start. Do not edit.
# Personal overrides: /home/u/.config/tracks-v2/tmux.conf
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:extkeys"
set -g escape-time 0
set -g extended-keys on
set -g focus-events on
set -g mouse on
set -g set-clipboard on
set -g history-limit 50000
set -g renumber-windows on
set -g status-interval 5
set -g pane-border-status top
set-environment -g COLORTERM truecolor
set-environment -g TRACKS_NEW_APP 1
set-environment -gu TRACKS_ID
set-environment -gu TRACKS_SOCKET_DIR
bind-key t run-shell -b "'/opt/tracks' --new-app trackwin add-terminal '#{window_id}'"
# Switching to a track lands on its agent pane.
bind-key 1 run-shell -b "'/opt/tracks' --new-app trackwin nav 1 '#{window_index}'"
bind-key 2 run-shell -b "'/opt/tracks' --new-app trackwin nav 2 '#{window_index}'"
bind-key 3 run-shell -b "'/opt/tracks' --new-app trackwin nav 3 '#{window_index}'"
bind-key 4 run-shell -b "'/opt/tracks' --new-app trackwin nav 4 '#{window_index}'"
bind-key 5 run-shell -b "'/opt/tracks' --new-app trackwin nav 5 '#{window_index}'"
bind-key 6 run-shell -b "'/opt/tracks' --new-app trackwin nav 6 '#{window_index}'"
bind-key 7 run-shell -b "'/opt/tracks' --new-app trackwin nav 7 '#{window_index}'"
bind-key 8 run-shell -b "'/opt/tracks' --new-app trackwin nav 8 '#{window_index}'"
bind-key 9 run-shell -b "'/opt/tracks' --new-app trackwin nav 9 '#{window_index}'"
bind-key < run-shell -b "'/opt/tracks' --new-app trackwin nav first '#{window_index}'"
bind-key > run-shell -b "'/opt/tracks' --new-app trackwin nav last '#{window_index}'"
bind-key n run-shell -b "'/opt/tracks' --new-app trackwin nav next '#{window_index}'"
bind-key p run-shell -b "'/opt/tracks' --new-app trackwin nav prev '#{window_index}'"
bind-key -n MouseDown1Status select-window -t = \; run-shell -b "'/opt/tracks' --new-app trackwin nav '#{window_index}' '#{window_index}'"
source-file "/home/u/.local/state/tracks-v2/theme.conf"
source-file -q "/home/u/.config/tracks-v2/tmux.conf"
