# The built-in Tracks theme. Every token needs a dark and a light value.
name: Tracks
tokens:
  text.default:       { dark: "#e4e4e7", light: "#27272a" }
  text.muted:         { dark: "#a1a1aa", light: "#52525b" }
  text.faint:         { dark: "#71717a", light: "#a1a1aa" }
  text.inverse:       { dark: "#18181b", light: "#fafafa" }
  text.accent:        { dark: "#1ccde8", light: "#0e7490" }

  bg.base:            { dark: "#041228", light: "#fafafa" }
  bg.surface:         { dark: "#27272a", light: "#f4f4f5" }
  bg.overlay:         { dark: "#303036", light: "#ffffff" }
  bg.selected:        { dark: "#3f3f46", light: "#e4e4e7" }
  bg.hover:           { dark: "#2f2f35", light: "#ececef" }

  border.default:     { dark: "#1ccde8", light: "#d4d4d8" }
  border.focus:       { dark: "#f5d000", light: "#0891b2" }
  border.accent:      { dark: "#d18b00", light: "#0891b2" }

  accent:             { dark: "#1ccde8", light: "#0891b2" }
  highlight:          { dark: "#f472b6", light: "#db2777" }

  state.success:      { dark: "#4ade80", light: "#16a34a" }
  state.warning:      { dark: "#facc15", light: "#ca8a04" }
  state.danger:       { dark: "#f87171", light: "#dc2626" }
  state.info:         { dark: "#60a5fa", light: "#2563eb" }

  footer.bg:          { dark: "#041228", light: "#ececef" }
  footer.text:        { dark: "#d4d4d8", light: "#3f3f46" }
  footer.muted:       { dark: "#8b8b94", light: "#71717a" }
  footer.faint:       { dark: "#52525b", light: "#a1a1aa" }
  footer.active.bg:   { dark: "#073542", light: "#dcdce0" }
  footer.active.text: { dark: "#1ccde8", light: "#0e7490" }

  banner.top:         { dark: "#1ccde8", light: "#0891b2" }
  banner.bottom:      { dark: "#0a515c", light: "#0a515c" }

  tab.text:           { dark: "#a1a1aa", light: "#52525b" }
  tab.border:         { dark: "#3f3f46", light: "#d4d4d8" }
  tab.active.bg:      { dark: "#073542", light: "#dcdce0" }
  tab.active.text:    { dark: "#1ccde8", light: "#0e7490" }
  tab.active.border:  { dark: "#1ccde8", light: "#0891b2" }

  table.text.default: { dark: "#a1d2e3", light: "#27272a" }
  table.text.muted:   { dark: "#4da5c4", light: "#52525b" }
  table.text.accent:  { dark: "#d18b00", light: "#0e7490" }
  table.text.faint:   { dark: "#71717a", light: "#a1a1aa" }
  table.bg.highlight: { dark: "#102547", light: "#ececef" }
  table.bg.selected:  { dark: "#102547", light: "#e4e4e7" }
