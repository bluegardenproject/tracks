# Keeps Tracks' dependencies current. Go module updates are fix(deps):
# a release ships them to the binaries' users; Actions updates are
# chore(ci), which release-please doesn't release.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      # The Charm v2 modules move together.
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"
      go-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
